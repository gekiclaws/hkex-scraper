name: Run HKEX scraper

on:
  workflow_dispatch:
  schedule:
    # Runs at 16:31 Hong Kong time, Monday through Friday.
    - cron: "31 8 * * 1-5"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
        shard_total: [4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper shard
        run: >
          python main.py
          --shard-index ${{ matrix.shard_index }}
          --shard-total ${{ matrix.shard_total }}
          --output stock_data_shard_${{ matrix.shard_index }}.csv

      - name: Upload CSV output
        uses: actions/upload-artifact@v4
        with:
          name: hkex-stock-data-shard-${{ matrix.shard_index }}
          path: stock_data_shard_${{ matrix.shard_index }}.csv
          if-no-files-found: error

      - name: Upload debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkex-scraper-debug-log-shard-${{ matrix.shard_index }}
          path: stock_scraper_debug.log
          if-no-files-found: ignore

  combine:
    runs-on: ubuntu-latest
    needs: scrape
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download shard CSV artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hkex-stock-data-shard-*
          path: shard-artifacts
          merge-multiple: true

      - name: Combine and sort shard CSVs
        run: python combine_shards.py --input-dir shard-artifacts --output stock_data.csv

      - name: Upload combined CSV output
        uses: actions/upload-artifact@v4
        with:
          name: hkex-stock-data
          path: stock_data.csv
          if-no-files-found: error
